name: Diagnose VOX on Fly

# READ-ONLY PRODUCTION DIAGNOSTICS.
#
# WHY THIS EXISTS. The chat path fails in production with "The model provider
# returned an error", which `src/lib/ai/anthropic.ts` already logs the real
# cause for (`ai.stream.failed`, carrying the SDK's own message). That evidence
# only exists in Fly's logs, and the sandbox an agent works in cannot reach
# fly.dev or hold a Fly credential. This workflow can: it runs on GitHub's
# infrastructure with the same `FLY_API_TOKEN` the deploy job uses.
#
# IT CHANGES NOTHING. No deploy, no restart, no secret write, no volume
# operation, no machine command. Every call below is a read.
#
# ---------------------------------------------------------------------------
# THIS REPOSITORY IS PUBLIC, SO THE OUTPUT IS FILTERED, NOT DUMPED
# ---------------------------------------------------------------------------
#
# Actions logs on a public repository are world-readable, so a raw
# `flyctl logs` dump is not acceptable: application logs can carry user
# content. Three rules hold throughout:
#
#   1. Secrets are listed by NAME ONLY. `flyctl secrets list` prints names,
#      digests and timestamps — never values — and even the digest column is
#      cut here. This answers "is ANTHROPIC_API_KEY present" without
#      revealing anything about it.
#   2. Logs are grepped for VOX's own diagnostic keys, not printed wholesale.
#   3. Everything is piped through a redactor that masks anything shaped like
#      a credential, as defence in depth for the case where a provider error
#      message quotes part of a request.
#
# Remove this workflow once the cause is fixed; a standing production-log
# reader is not something a repository should keep lying around.

on:
  workflow_dispatch:
    inputs:
      log_minutes:
        description: "How far back to search the logs (minutes)"
        required: false
        default: "60"

concurrency:
  group: fly-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: read-only production diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: vox-ethansly04
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The redactor every step pipes through. Masks Anthropic keys, bearer
      # tokens, and long base64 runs (the shape of VOX_ENCRYPTION_KEY /
      # VOX_SESSION_SECRET) so no accidental echo can leak one.
      - name: Install redactor
        run: |
          cat > /tmp/redact.sed <<'SED'
          s/sk-ant-[A-Za-z0-9_-]*/sk-ant-***REDACTED***/g
          s/[Bb]earer [A-Za-z0-9._-]\{12,\}/Bearer ***REDACTED***/g
          s/[A-Za-z0-9+\/]\{40,\}=\{0,2\}/***REDACTED-LONG-TOKEN***/g
          SED
          echo "redactor installed"

      - name: App status (machine state, region, release)
        run: flyctl status --app "$APP_NAME" 2>&1 | sed -f /tmp/redact.sed || true

      - name: Secret NAMES only (presence check — never values)
        run: |
          echo "Which secrets exist on $APP_NAME (names only):"
          # awk prints field 1 alone, so the digest and timestamp columns never
          # reach the log. The grep -c lines are the actual question being
          # asked: is the provider key set at runtime at all?
          flyctl secrets list --app "$APP_NAME" 2>&1 | awk '{print $1}' | sed -f /tmp/redact.sed || true
          echo "---"
          NAMES=$(flyctl secrets list --app "$APP_NAME" 2>/dev/null | awk '{print $1}')
          for key in ANTHROPIC_API_KEY VOX_AI_PROVIDER VOX_ANTHROPIC_MODEL VOX_ENCRYPTION_KEY VOX_SESSION_SECRET VOYAGE_API_KEY; do
            if echo "$NAMES" | grep -qx "$key"; then echo "PRESENT: $key"; else echo "ABSENT:  $key"; fi
          done

      - name: VOX diagnostic log lines (filtered, redacted)
        run: |
          MINS="${{ github.event.inputs.log_minutes || '60' }}"
          echo "Searching the last ${MINS}m of logs for VOX's own error keys."
          # --no-tail so the command terminates. Only VOX's structured
          # diagnostic keys are matched; nothing else is printed.
          flyctl logs --app "$APP_NAME" --no-tail 2>&1 \
            | grep -aE 'ai\.stream\.failed|ai\.generate\.failed|chat\.stream\.provider_error|chat\.setup_failed|chat\.orchestrated\.failed|ai\.stream\b' \
            | tail -60 \
            | sed -f /tmp/redact.sed \
            || echo "No matching diagnostic lines in the retained log window."

      - name: Recent error-level lines (filtered, redacted)
        run: |
          flyctl logs --app "$APP_NAME" --no-tail 2>&1 \
            | grep -aiE '"level":"error"|unhandled|ECONNREFUSED|ENOTFOUND|ETIMEDOUT|authentication_error|permission_error|not_found_error|rate_limit|invalid_request_error|credit balance|overloaded' \
            | tail -60 \
            | sed -f /tmp/redact.sed \
            || echo "No matching error lines in the retained log window."
