name: Verify

# The quality gate, enforced rather than remembered.
#
# WHY THIS EXISTS. Until now VOX's gate — typecheck, lint, tests, build — was a
# convention written in CLAUDE.md and carried out by hand. That is exactly the
# kind of rule that gets partially applied under time pressure: this repository
# has already had a commit reported as green on the strength of one test subset,
# with a failing test in the tree. A convention cannot fail a pull request; this
# can.
#
# NO SECRETS ARE NEEDED, and that is verified rather than assumed:
#   * `npm run build` was run in this repository with .env removed entirely and
#     exited 0 — Next.js does not evaluate the throw-on-missing-env code paths
#     (crypto.ts, session.ts) during a build.
#   * The test run supplies its own environment from vitest.config.mts, and the
#     `pretest` script provisions prisma/test.db with `prisma migrate deploy`.
#   * `postinstall` runs `prisma generate`, so the client exists after `npm ci`.
# So this workflow needs no database service, no container, and no repository
# secret. Anything added here later should have to justify itself the same way.

on:
  push:
    # `main` is listed for when a trunk exists (see fly-deploy.yml's note — the
    # repository currently has no main branch). `claude/**` covers the working
    # branches every session actually pushes to, so the gate runs on real work
    # today instead of waiting for a branching strategy.
    branches: [main, "claude/**"]
  pull_request:
  # Callable by fly-deploy.yml so a deploy cannot run against unverified code.
  workflow_call:

concurrency:
  # Supersede an in-flight run for the same ref: the newest commit is the one
  # whose verdict matters. Never cancels a run on a different branch.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    # The full suite is ~172s locally and the build ~60s; 20 minutes leaves
    # generous headroom for a cold npm cache without hanging a stuck job all day.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed against (v22.x).
          # package.json declares no `engines`, so the version is pinned here
          # rather than left to whatever the runner image defaults to.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci`, not `npm install`: it installs exactly package-lock.json and
        # fails if the lockfile and manifest disagree, so CI cannot silently
        # resolve a different dependency tree than the one that was reviewed.
        run: npm ci

      # ---- The gate, in order. Each stage fails the workflow on a non-zero
      # exit, and no stage is allowed to be skipped or narrowed. ----

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (full suite)
        # The FULL suite. Not a subset, not a filtered path, not `--changed`.
        # A subset that passes is not evidence the gate passed, and this line is
        # the one place that guarantee is mechanical rather than remembered.
        run: npm test

      - name: Build
        run: npm run build
