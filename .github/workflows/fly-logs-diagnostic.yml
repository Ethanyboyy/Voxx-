name: VOX Fly.io logs (diagnostic)

# Temporary, READ-ONLY production diagnostic. It does not deploy, restart,
# write a secret, touch the volume, or run any command that changes state.
#
# Findings are posted as an issue comment as well as printed, because an
# Actions job log is served from *.blob.core.windows.net — a host an agent
# sandbox's network policy commonly denies, which otherwise leaves a
# diagnostic that can be RUN but not READ.
#
# ---------------------------------------------------------------------------
# WHAT THIS ROUND IS TESTING
# ---------------------------------------------------------------------------
#
# The API key was replaced and the 401 did not change. Replacing a key and
# getting the identical error back means the thing being tested is probably not
# the key's VALUE. The differential below separates the candidates that all
# present as `invalid x-api-key`:
#
#   1. SURROUNDING WHITESPACE. `new Anthropic({ apiKey })` receives
#      process.env.ANTHROPIC_API_KEY verbatim — nothing trims it. A value
#      pasted into a dashboard field can carry a trailing newline or space,
#      which goes straight into the x-api-key header and is rejected as
#      invalid. Indistinguishable from a wrong key from the outside. Tested by
#      probing with the raw value and again with a trimmed copy.
#   2. A REDIRECTED BASE URL. The constructor sets no baseURL, so the SDK
#      honours ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN from the environment
#      if either is set. A key sent to the wrong endpoint fails as invalid.
#   3. THE SECRET NEVER REACHED THIS MACHINE. Compared by secret digest
#      timestamp against the machine's own last-updated time.
#   4. THE WRONG APP. fly.toml briefly named `voxmoney1`; if the new key was
#      set there, vox-ethansly04 still holds the old one.
#   5. WRONG CREDENTIAL CLASS. An admin key or OAuth token is not an API key.
#
# ---------------------------------------------------------------------------
# NO SECRET VALUE IS PRINTED, POSTED, OR TRANSMITTED
# ---------------------------------------------------------------------------
#
# This repository is PUBLIC, so everything below is built to be safe in public.
# The key is never echoed, and neither is its length. What IS reported about it
# is only: whether it is set, whether trimming it changes it and by how many
# characters, and whether it begins with the documented `sk-ant-` prefix. None
# of those narrows the value. The probes send the key to Anthropic only — the
# same destination the application itself uses — and report back nothing but
# the HTTP status, the request id, and the provider's own error type and
# message. Every posted line also passes through a redactor.
#
# Delete this workflow once production is healthy; a standing production-log
# reader holding a Fly token does not belong in a repository.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to post findings to. Blank creates one."
        required: false
        default: ""
      app_name:
        description: "Fly app to inspect. Defaults to vox-ethansly04."
        required: false
        default: "vox-ethansly04"

permissions:
  contents: read
  issues: write

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: ${{ github.event.inputs.app_name || 'vox-ethansly04' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install redactor
        run: |
          cat > /tmp/redact.sed <<'SED'
          s/sk-ant-[A-Za-z0-9_-]*/sk-ant-***REDACTED***/g
          s/[Bb]earer [A-Za-z0-9._-]\{12,\}/Bearer ***REDACTED***/g
          s/[A-Za-z0-9+\/]\{40,\}=\{0,2\}/***REDACTED-LONG-TOKEN***/g
          SED
          : > /tmp/report.md

      - name: Machine state and release
        run: |
          {
            echo "### Machine state"
            echo '```'
            flyctl status --app "$APP_NAME" 2>&1 | sed -f /tmp/redact.sed | head -30
            echo '```'
          } >> /tmp/report.md

      # Digest + timestamp per secret. flyctl never prints values; the digest
      # is a one-way fingerprint whose only use here is "did this change, and
      # when" relative to the machine's last update.
      - name: Secret inventory — names and change times only
        run: |
          {
            echo "### Secrets on \`$APP_NAME\` (names and change times; no values)"
            echo '```'
            flyctl secrets list --app "$APP_NAME" 2>&1 | sed -f /tmp/redact.sed
            echo '```'
          } >> /tmp/report.md

      # The decisive timeline. `flyctl secrets set` creates a RELEASE, so the
      # release list answers "has anything at all been applied to this app
      # since the last deploy" — which distinguishes a key that was replaced
      # somewhere else from a key that was replaced here and still fails.
      - name: Release history (did any change land on this app?)
        run: |
          {
            echo "### Release history"
            echo '```'
            flyctl releases list --app "$APP_NAME" 2>&1 | sed -f /tmp/redact.sed | head -20
            echo '```'
            echo "### Machines"
            echo '```'
            flyctl machines list --app "$APP_NAME" 2>&1 | sed -f /tmp/redact.sed | head -15
            echo '```'
          } >> /tmp/report.md

      # Candidate 4: was the new key set on the other app by mistake?
      - name: Does another app hold a provider key?
        run: |
          {
            echo "### Other apps on this account"
            echo '```'
            flyctl apps list 2>&1 | sed -f /tmp/redact.sed | head -20
            echo '```'
            echo "Secret names on \`voxmoney1\` (if it exists):"
            echo '```'
            flyctl secrets list --app voxmoney1 2>&1 | awk '{print $1}' | sed -f /tmp/redact.sed | head -15 \
              || echo "(no such app, or not accessible)"
            echo '```'
          } >> /tmp/report.md

      # The differential. Runs inside the live container against the real
      # environment the application reads.
      - name: Credential differential (no value printed)
        run: |
          flyctl ssh console --app "$APP_NAME" -C "node -e \"
            const raw = process.env.ANTHROPIC_API_KEY;
            console.log('D set=' + Boolean(raw));
            if (!raw) { console.log('D result=NOT_SET'); process.exit(0); }
            const trimmed = raw.trim();
            console.log('D needs_trim=' + (trimmed !== raw));
            console.log('D trim_delta_chars=' + (raw.length - trimmed.length));
            console.log('D has_sk_ant_prefix=' + trimmed.startsWith('sk-ant-'));
            console.log('D has_inner_whitespace=' + /\\\\s/.test(trimmed));
            console.log('D base_url_set=' + Boolean(process.env.ANTHROPIC_BASE_URL));
            console.log('D base_url=' + (process.env.ANTHROPIC_BASE_URL || '(unset)'));
            console.log('D auth_token_set=' + Boolean(process.env.ANTHROPIC_AUTH_TOKEN));
            console.log('D vox_ai_provider=' + (process.env.VOX_AI_PROVIDER || '(unset)'));
            console.log('D vox_model=' + (process.env.VOX_ANTHROPIC_MODEL || '(unset -> claude-sonnet-5)'));
            // Sign-in prerequisites. Booleans only — never the values. A
            // missing VOX_SESSION_SECRET makes hashToken() throw, which
            // apiErrorResponse turns into a bare 500 'Internal server error'.
            console.log('D session_secret_set=' + Boolean(process.env.VOX_SESSION_SECRET));
            console.log('D encryption_key_set=' + Boolean(process.env.VOX_ENCRYPTION_KEY));
            console.log('D database_url=' + (process.env.DATABASE_URL || '(unset)'));
            const probe = (label, key) => fetch('https://api.anthropic.com/v1/models?limit=1', {
              headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01' },
            }).then(async (res) => {
              let body = {};
              try { body = JSON.parse(await res.text()); } catch (e) {}
              console.log('D ' + label + '_status=' + res.status);
              console.log('D ' + label + '_request_id=' + (res.headers.get('request-id') || '(none)'));
              console.log('D ' + label + '_error_type=' + ((body.error && body.error.type) || (res.ok ? '(none)' : '(unparsed)')));
              console.log('D ' + label + '_error_message=' + ((body.error && body.error.message) || (res.ok ? 'OK' : '(unparsed)')));
            }).catch((e) => console.log('D ' + label + '_fetch_error=' + e.message));
            probe('raw', raw).then(() => (trimmed !== raw ? probe('trimmed', trimmed) : null));
          \"" 2>&1 | tee /tmp/diff.txt | sed -f /tmp/redact.sed || true
          {
            echo "### Credential differential (inside the running container)"
            echo '```'
            grep -a '^D ' /tmp/diff.txt | sed -f /tmp/redact.sed || echo "probe produced no D lines"
            echo '```'
          } >> /tmp/report.md

      # THE SIGN-IN DISCRIMINATOR. The login page is a server component that
      # calls hasAnyUser() -> db.user.count() BEFORE rendering, so a database
      # with no tables renders a 500 while /api/health still passes (its
      # `SELECT 1` touches no table and happily opens an empty file). This asks
      # the one question that separates that from a missing session secret:
      # does the schema actually exist on this machine's volume?
      #
      # Reads sqlite_master for table NAMES and a row count. No column values,
      # no user content, nothing encrypted — and it opens the file readonly.
      - name: Schema presence on the mounted volume (read-only)
        run: |
          flyctl ssh console --app "$APP_NAME" -C "node -e \"
            const path = (process.env.DATABASE_URL || '').replace(/^file:/, '') || '/data/prod.db';
            const fs = require('fs');
            console.log('S db_path=' + path);
            console.log('S db_file_exists=' + fs.existsSync(path));
            try { console.log('S db_size_bytes=' + fs.statSync(path).size); } catch (e) { console.log('S db_size_bytes=(none)'); }
            try {
              const D = require('better-sqlite3');
              const db = new D(path, { readonly: true, fileMustExist: true });
              const names = db.prepare(\\\"SELECT name FROM sqlite_master WHERE type='table'\\\").all().map(r => r.name);
              console.log('S table_count=' + names.length);
              console.log('S has_User_table=' + names.includes('User'));
              console.log('S has_Session_table=' + names.includes('Session'));
              console.log('S has_migrations_table=' + names.includes('_prisma_migrations'));
              if (names.includes('User')) {
                console.log('S user_row_count=' + db.prepare('SELECT COUNT(*) c FROM User').get().c);
              }
              if (names.includes('_prisma_migrations')) {
                console.log('S migrations_applied=' + db.prepare('SELECT COUNT(*) c FROM _prisma_migrations').get().c);
              }
            } catch (e) { console.log('S open_error=' + e.message); }
          \"" 2>&1 | tee /tmp/schema.txt | sed -f /tmp/redact.sed || true
          {
            echo "### Schema presence on the volume"
            echo '```'
            grep -a '^S ' /tmp/schema.txt | sed -f /tmp/redact.sed || echo "probe produced no S lines"
            echo '```'
          } >> /tmp/report.md

      # Raw logs stay in the job log (owner-readable). Only VOX's own
      # structured error keys reach the public comment.
      - name: Logs — raw to job log, filtered to report
        run: |
          timeout 30 flyctl logs --app "$APP_NAME" --no-tail > /tmp/raw.log 2>&1 || true
          echo "--- raw tail (job log only) ---"
          tail -80 /tmp/raw.log | sed -f /tmp/redact.sed || true
          {
            echo "### VOX diagnostic log lines"
            echo '```'
            grep -aoE '(api\.unhandled_error|auth\.|ai\.stream\.failed|ai\.generate\.failed|chat\.stream\.provider_error|no such table|VOX_SESSION_SECRET|VOX_ENCRYPTION_KEY|PrismaClient|Error:).{0,200}' /tmp/raw.log \
              | tail -30 | sed -f /tmp/redact.sed \
              || echo "none in the retained window"
            echo '```'
          } >> /tmp/report.md

      - name: Post findings
        run: |
          sed -i -f /tmp/redact.sed /tmp/report.md
          {
            echo "## Production diagnostic — \`$APP_NAME\`"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo
          } > /tmp/final.md
          cat /tmp/report.md >> /tmp/final.md
          N="${{ github.event.inputs.issue_number }}"
          if [ -z "$N" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Production diagnostic: provider 401 persists after key rotation" \
              --body-file /tmp/final.md
          else
            gh issue comment "$N" --repo "${{ github.repository }}" --body-file /tmp/final.md
          fi
