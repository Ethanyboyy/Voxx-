# fly.toml app configuration file generated for voxmoney1 on 2026-10-08T10:34:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voxmoney1'
primary_region = 'ord'

[build]

[env]
  DATABASE_URL = 'file:/data/prod.db'
  NODE_ENV = 'production'

[[mounts]]
  source = 'vox_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
